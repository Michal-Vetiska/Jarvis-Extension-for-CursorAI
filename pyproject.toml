[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "J.A.R.V.I.S. — autonomní český hlasový asistent pro macOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "sounddevice>=0.4.6",
  "openwakeword>=0.6.0",
  "onnxruntime>=1.17.0",
  "tomli>=2.0.1; python_version<'3.11'",
]

[project.optional-dependencies]
stt = [
  "mlx-whisper>=0.4.0; platform_machine=='arm64' and platform_system=='Darwin'",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
jarvis = "jarvis.main:main"
jarvis-backend = "jarvis.main:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
